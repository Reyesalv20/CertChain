# ── Módulo: llm-service (FastAPI) + ollama ─────────────────
# Levantar desde esta carpeta:
#   docker compose up -d
# La red certchain-network tiene nombre fijo (compartida entre servicios).
services:
  llm-service:
    build: .
    container_name: certchain-llm
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL_LLAMA3=${OLLAMA_MODEL_LLAMA3:-llama3}
      - OLLAMA_MODEL_MISTRAL=${OLLAMA_MODEL_MISTRAL:-mistral}
      # Endpoint del backend para consultar certificados (placeholder).
      - CERTIFICADOS_SERVICE_URL=http://backend:4000
      - MOCK_CERTIFICADOS=${MOCK_CERTIFICADOS:-true}
    volumes:
      - ./:/app
    depends_on:
      - ollama
    networks:
      - certchain-network

  ollama:
    image: ollama/ollama
    container_name: certchain-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - certchain-network

volumes:
  ollama-data:

networks:
  certchain-network:
    name: certchain-network
    driver: bridge
