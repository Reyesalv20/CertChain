# ─────────────────────────────────────────────────────────────
# CertChain — orquestador Docker Compose (raíz)
#
# Cada servicio tiene su propio docker-compose.yml (módulo) y este archivo
# los incluye a todos en un mismo proyecto/red, así podés levantar lo que
# necesites "independientemente" desde la raíz:
#
#   docker compose up -d frontend            # frontend (más backend/blockchain si los levantás antes)
#   docker compose up -d backend             # backend
#   docker compose up -d blockchain-server   # solo el blockchain-service (anvil+deploy+blockchain-server)
#   docker compose up -d llm-service         # llm + ollama
#
# Las variables se leen del .env de la raíz (ver .env.example).
# Cada módulo declara la red certchain-network con nombre fijo, así también
# podés levantar cada servicio standalone desde su propia carpeta
# (cd frontend && docker compose up -d, cd blockchain-service && docker compose up -d, ...).
# ─────────────────────────────────────────────────────────────
include:
  - ./frontend/docker-compose.yml
  - ./backend/docker-compose.yml
  - ./blockchain-service/docker-compose.yml
  - ./llm-service/docker-compose.yml
