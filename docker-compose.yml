include:
  - ./blockchain-service/docker-compose.yml
services:
  # --- Portal (Next.js): institucional + público ---
  frontend:
    build: ./frontend
    container_name: certchain-frontend
    ports:
      - "3000:3000"
    environment:
      # Esta URL la usa el BROWSER del usuario -> debe ser localhost, NO el nombre del servicio
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
      # Esta URL es para llamadas server-side (SSR / route handlers) dentro de la red de Docker
      - BACKEND_INTERNAL_URL=http://backend:4000
      # Sin esto, la primera vez que corre "next dev" muestra el prompt de
      # telemetría y, al no haber una terminal interactiva en el contenedor,
      # el proceso se queda esperando input y termina solo (exit code 0).
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - certchain-network

  # --- API principal (NestJS) ---
  backend:
    build: ./backend
    container_name: certchain-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - LLM_SERVICE_URL=http://llm-service:5000
      # El servicio de blockchain real se llama "server" (definido en
      # blockchain-service/docker-compose.yml), ya no "blockchain-service"
      - BLOCKCHAIN_SERVICE_URL=http://server:6000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - server
      - llm-service
    networks:
      - certchain-network

  # NOTA: el servicio de blockchain ya no se define aquí. Ahora vive en
  # ./blockchain-service/docker-compose.yml (incluido arriba con "include:"),
  # que trae 3 servicios: anvil (blockchain local), deploy (despliega el
  # contrato) y server (la API real, en el puerto 6000).

  # --- Servicio LLM/RAG (placeholder hasta que se implemente) ---
  llm-service:
    build: ./llm-service
    container_name: certchain-llm
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./llm-service:/app
    depends_on:
      - ollama
    networks:
      - certchain-network

  # --- Motor de modelos LLM ---
  ollama:
    image: ollama/ollama
    container_name: certchain-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - certchain-network

networks:
  certchain-network:
    driver: bridge

volumes:
  ollama-data:
